global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

storage:
  tsdb:
    retention:
      time: 15d
      size: 2GB

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: [prometheus:9090]

  - job_name: matchuri-backend
    metrics_path: /api/v1/prometheus
    follow_redirects: false
    file_sd_configs:
      - files: [/etc/prometheus/perf-targets/app.json]
    metric_relabel_configs:
      - source_labels: [uri]
        regex: /api/v1/prometheus
        action: drop

  - job_name: mysql
    scrape_interval: 15s
    follow_redirects: false
    file_sd_configs:
      - files: [/etc/prometheus/perf-targets/mysql.json]

  - job_name: host-a
    scrape_interval: 15s
    follow_redirects: false
    file_sd_configs:
      - files: [/etc/prometheus/perf-targets/host-a.json]
    metric_relabel_configs: &host_metrics
      - source_labels: [__name__]
        regex: node_(time_seconds|cpu_seconds_total|memory_Mem(Available|Total)_bytes|filesystem_(avail|size)_bytes|network_(receive|transmit)_bytes_total)|windows_(system_system_up_time|cpu_time(_seconds)?_total|memory_(available|physical_total)_bytes|os_physical_memory_free_bytes|cs_physical_memory_bytes|logical_disk_(free|size)_bytes|net_bytes_(received_total|sent_total|total))
        action: keep

  - job_name: host-b
    scrape_interval: 15s
    follow_redirects: false
    file_sd_configs:
      - files: [/etc/prometheus/perf-targets/host-b.json]
    metric_relabel_configs: *host_metrics
