name: matchuri-perf-b

services:
  gateway:
    image: nginx:1.28.2-alpine@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    ports:
      - "${PERF_BIND_IP:?Set the test PC B private LAN IP}:${PERF_API_PORT:-18080}:8080"
      - "${PERF_BIND_IP:?Set the test PC B private LAN IP}:${PERF_MANAGEMENT_PORT:-18081}:8081"
      - "${PERF_BIND_IP:?Set the test PC B private LAN IP}:${PERF_MYSQL_METRICS_PORT:-19104}:9104"
    volumes:
      - ./backend/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${PERF_IDENTITY_DIR:-./runtime/b/identity}
        target: /srv/perf
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: none
    depends_on:
      app:
        condition: service_healthy
      mysql-exporter:
        condition: service_started
    networks:
      - ingress
      - target

  app:
    image: matchuri-perf-backend:${PERF_BACKEND_SHA:?Set the full backend Git SHA}
    build:
      context: ./backend
      additional_contexts:
        backend_source: ../backend
      args:
        BACKEND_SHA: ${PERF_BACKEND_SHA:?Set the full backend Git SHA}
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/matchuri/config/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/matchuri_perf?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: matchuri_perf
      JAVA_TOOL_OPTIONS: ${PERF_JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65 -Duser.timezone=UTC}
      TZ: UTC
    secrets:
      - source: mysql-app
        target: spring.datasource.password
      - source: jwt
        target: matchuri.auth.jwt.secret
      - source: provider-aes
        target: matchuri.auth.provider-token.encryption-key
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081;
          printf 'GET /api/v1/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r -t 3 status <&3;
          [[ "$$status" == "HTTP/1.1 200 "* ]]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 4
    mem_limit: ${PERF_APP_MEMORY:-2g}
    networks:
      - target

  mysql:
    image: mysql:8.0.45@sha256:4af1f8815716546f5b12410f7621f37f93db8dd11a184706ef59111930b8c2ff
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${PERF_MYSQL_BUFFER_POOL:-512M}
      - --performance-schema=ON
    environment:
      MYSQL_DATABASE: matchuri_perf
      MYSQL_USER: matchuri_perf
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-app
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root
      TZ: UTC
    secrets:
      - mysql-app
      - mysql-root
      - mysql-exporter
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/mysql-init.sh:/docker-entrypoint-initdb.d/10-matchuri-perf.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export MYSQL_PWD="$$(cat /run/secrets/mysql-app)";
          mysql --protocol=TCP --host=127.0.0.1 --user=matchuri_perf --database=matchuri_perf
          --batch --skip-column-names --execute="SELECT environment FROM perf_environment WHERE id=1"
          | grep -qx 'matchuri-perf'
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${PERF_MYSQL_MEMORY:-2g}
    networks:
      - target

  mysql-exporter:
    image: prom/mysqld-exporter:v0.18.0@sha256:2598c0571f383708e19016d119bb45c06128a9ebc962c9f49483278ac5a94c41
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export MYSQLD_EXPORTER_PASSWORD="$$(cat /run/secrets/mysql-exporter)";
        exec /bin/mysqld_exporter --mysqld.address=mysql:3306 --mysqld.username=matchuri_metrics
        --no-collect.global_variables --no-collect.slave_status --no-collect.info_schema.innodb_cmp
        --no-collect.info_schema.innodb_cmpmem --no-collect.info_schema.query_response_time
    secrets:
      - mysql-exporter
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - target

secrets:
  mysql-app:
    file: ${PERF_SECRET_DIR:-./runtime/b/secrets}/mysql-app
  mysql-root:
    file: ${PERF_SECRET_DIR:-./runtime/b/secrets}/mysql-root
  mysql-exporter:
    file: ${PERF_SECRET_DIR:-./runtime/b/secrets}/mysql-exporter
  jwt:
    file: ${PERF_SECRET_DIR:-./runtime/b/secrets}/jwt
  provider-aes:
    file: ${PERF_SECRET_DIR:-./runtime/b/secrets}/provider-aes

networks:
  ingress:
  target:
    internal: true

volumes:
  mysql-data:
