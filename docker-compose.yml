name: matchuri-perf-a

x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:${PERF_PROMETHEUS_PORT:-19090}:9090"
    environment:
      <<: *no-proxy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./runtime/a/targets:/etc/prometheus/perf-targets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:${PERF_GRAFANA_PORT:-13000}:3000"
    environment:
      <<: *no-proxy
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets:
      - grafana-password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: matchuri-perf-k6:2.3.0-sse0.2.0
    build:
      context: ./backend
      dockerfile: Dockerfile.k6
    profiles:
      - load-test
    working_dir: /scripts
    volumes:
      - ./k6:/scripts:ro
    environment:
      <<: *no-proxy
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    logging:
      driver: none
    depends_on:
      - prometheus

secrets:
  grafana-password:
    file: ${PERF_GRAFANA_PASSWORD_FILE:-./runtime/a/grafana-password}

volumes:
  prometheus-data:
  grafana-data:
