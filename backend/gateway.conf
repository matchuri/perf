resolver 127.0.0.11 valid=10s ipv6=off;

upstream perf_api {
    zone perf_api 64k;
    server app:8080 resolve;
    keepalive 32;
}

upstream perf_management {
    zone perf_management 64k;
    server app:8081 resolve;
    keepalive 4;
}

upstream perf_mysql_exporter {
    zone perf_mysql_exporter 64k;
    server mysql-exporter:9104 resolve;
    keepalive 2;
}

map "$request_method:$uri" $perf_upstream {
    default "";
    ~^GET:/api/v1/health$ perf_management;
    ~^GET:/api/v1/(home|attribute-categories|restriction-ingredients|menu-items)$ perf_api;
    ~^GET:/api/v1/menu-items/[0-9]+$ perf_api;
    ~^GET:/api/v1/members/exists/(nickname/)?[^/]+$ perf_api;
    ~^GET:/api/v1/members/(me|me/(location|taste-profile)|profile/preset-image)$ perf_api;
    ~^GET:/api/v1/member-agreements/required-status$ perf_api;
    ~^GET:/api/v1/personal/recommendations(/[0-9]+(/candidates)?)?$ perf_api;
    ~^GET:/api/v2/personal/recommendations$ perf_api;
    ~^GET:/api/v1/groups(/[0-9]+(/invite-link|/recommendations(/[0-9]+(/candidates|/readiness)?)?)?)?$ perf_api;
    ~^GET:/api/v2/groups/[0-9]+(/recommendations)?$ perf_api;
    ~^GET:/api/v1/(invites/me/exists|groups/invites/me)$ perf_api;
    ~^GET:/api/v2/invites/me$ perf_api;
    ~^GET:/api/v1/(groups/[0-9]+/)?realtime/events$ perf_api;
    ~^GET:/api/v1/admin/(attribute-categories|ingredients|menu-items(/[0-9]+)?|preset-profile-images)$ perf_api;
    ~^POST:/api/v1/(auth/login|guest/recommendations|groups/invite-links/preview)$ perf_api;
}

server {
    listen 8080;
    server_name _;
    access_log off;
    error_log /dev/null;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_next_upstream off;

    location = /__perf/identity {
        if ($request_method != GET) { return 405; }
        alias /srv/perf/identity.json;
        default_type application/json;
        add_header Cache-Control no-store always;
    }

    location ~ ^/api/v1/auth/oauth2/[^/]+$ {
        if ($request_method != GET) { return 405; }
        proxy_pass http://perf_api;
    }

    location / {
        if ($perf_upstream = "") { return 404; }
        proxy_pass http://$perf_upstream;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 =502 /__perf/rejected-redirect;
    }

    location = /__perf/rejected-redirect {
        internal;
        return 502;
    }
}

server {
    listen 8081;
    server_name _;
    access_log off;
    error_log /dev/null;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_headers off;

    location ~ ^/api/v1/(health|prometheus)$ {
        if ($request_method != GET) { return 405; }
        proxy_pass http://perf_management;
    }

    location / { return 404; }
}

server {
    listen 9104;
    server_name _;
    access_log off;
    error_log /dev/null;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_headers off;

    location = /metrics {
        if ($request_method != GET) { return 405; }
        if ($args != "") { return 400; }
        proxy_set_header X-Prometheus-Scrape-Timeout-Seconds $http_x_prometheus_scrape_timeout_seconds;
        proxy_pass http://perf_mysql_exporter;
    }

    location / { return 404; }
}
